name: Continuous AI Self-Healing Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  run-application-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Test Suite
        id: tests
        continue-on-error: true
        run: |
          python test_calculator.py > test_crash_report.txt 2>&1

      - name: Trigger Copilot Engine to Heal Build
        if: steps.tests.outcome == 'failure'
        run: |
          echo "Installing GitHub Agentic Workflows extension..."
          gh extension install github/gh-aw
          
          echo "Executing agent reasoning loop on failure log..."
          gh aw run .github/workflows/self-heal-agent.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
