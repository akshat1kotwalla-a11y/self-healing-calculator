# ... (Keep automatically generated top-level parameters)
name: Continuous AI Self-Healing Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  run-application-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Test Suite
        run: |
          python test_calculator.py > test_crash_report.txt 2>&1

      - name: Trigger Copilot Engine to Heal Build
        if: failure()
        uses: github/gh-aw@main
        with:
          agent: '.github/workflows/self-heal-agent.md'
          engine: 'github-copilot'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          context: |
            PYTHON TEST FAILURE LOG:
            $(cat test_crash_report.txt)

            RECENT SYSTEM COMMITS:
            $(git log -n 5 --oneline)
