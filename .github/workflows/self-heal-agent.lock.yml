# ... (Keep automatically generated top-level parameters)
name: Continuous AI Self-Healing Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions: 
  contents: write
  pull-requests: write
  issues: write
jobs:
  run-application-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Test Suite
        id: tests
        continue-on-error: true
        run: |
          python test_calculator.py > test_crash_report.txt 2>&1

      - name: Trigger Copilot Engine to Heal Build
        if: steps.tests.outcome == 'failure'
        uses: github/gh-aw-actions/setup@main
        with:
          destination: '.github/copilot-agent-workspace'
          job-name: 'run-application-tests'
